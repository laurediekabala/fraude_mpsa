# ======================================================
# Configuration métier – Moteur de décision fraude
# ======================================================

thresholds:
  accept: 0.30     # En dessous → ACCEPT
  review: 0.70     # Entre accept et review → REVIEW
                   # Au-dessus → REJECT

# ======================================================
# Coûts business (en dollars)
# ======================================================

costs:
  fp: 50.0         # Faux positif (transaction valide rejetée)
  fn: 500.0        # Faux négatif (fraude acceptée)
  manual_review: 5.0  # Coût fixe d'une revue manuelle