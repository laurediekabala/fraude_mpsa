services:
  - type: web
    name: fraude-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd api_flask && python app.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.5"
    
  - type: web
    name: fraude-interface
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd streamlit && streamlit run app.py --server.port=$PORT --server.address=0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.5"
      - key: API_URL
        value: "https://fraude-api.onrender.com"